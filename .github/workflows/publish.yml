name: publish

on:
  workflow_dispatch:

jobs:
  publish-tauri-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: install frontend dependencies
        run: bun install

      - name: download database
        run: |
          curl -L -o database.sqlite `
            "https://github.com/Leon135/Synonik-db-builder/releases/latest/download/database.sqlite"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Synonik v__VERSION__"
          releaseBody: "See the assets below to download and install."
          releaseDraft: true
          prerelease: false

  publish-tauri-linux:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2 file

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: bun install

      - name: download database
        run: |
          curl -L -o database.sqlite \
            "https://github.com/Leon135/Synonik-db-builder/releases/latest/download/database.sqlite"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Synonik v__VERSION__"
          releaseBody: "See the assets below to download and install."
          releaseDraft: true
          prerelease: false
          args: --bundles appimage

      # The AppImage bundles ubuntu's libwayland-client (1.22) while libEGL,
      # libgbm and libdrm come from the host. On Mesa 25+ the host libEGL binds
      # the stale bundled copy, EGL init fails with EGL_BAD_ALLOC and the
      # WebKit aux process aborts, taking the app down with exit code 6.
      # Dropping the bundled libwayland lets the host copy satisfy the soname.
      - name: strip stale libwayland from AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          appdir=$(echo src-tauri/target/release/bundle/appimage/*.AppDir)
          asset="src-tauri/target/release/bundle/appimage/Synonik_${version}_amd64.AppImage"

          [ -d "$appdir" ] || { echo "no AppDir found" >&2; exit 1; }

          curl -sSL -o /tmp/appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool

          rm -f "$appdir"/usr/lib/libwayland-client.so.0 \
                "$appdir"/usr/lib/libwayland-cursor.so.0 \
                "$appdir"/usr/lib/libwayland-egl.so.1

          ARCH=x86_64 /tmp/appimagetool --no-appstream "$appdir" "$asset"
          [ -f "$asset" ] || { echo "repack produced no asset" >&2; exit 1; }

          gh release upload "app-v${version}" "$asset" --clobber
